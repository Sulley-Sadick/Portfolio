<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sulley Sadick monogram">
  <defs>
    <linearGradient id="ss-bg" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="ss-mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aeea0"/>
      <stop offset="55%" stop-color="#53dd6c"/>
      <stop offset="100%" stop-color="#3db856"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ss-bg)"/>
  <rect
    x="1.5"
    y="1.5"
    width="61"
